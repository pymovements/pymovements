name: build

on:
  push:
    branches: [main]
  schedule:
     - cron: "30 3 * * *"
  workflow_call:

jobs:
  # The scheduled run installs the newest dependencies in the tests workflow,
  # every other run the pinned ones. The benchmark stays pinned: it compares
  # two commits in one environment and has nothing to learn from a release.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      unpinned: ${{ github.event_name == 'schedule' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Contents write is for the alert commit comment and for publishing the
  # chart to gh-pages on push to main. Pull request runs reach benchmark.yml
  # directly, not through this job.
  benchmark:
    uses: ./.github/workflows/benchmark.yml
    permissions:
      contents: write

  build:
    needs: [tests, benchmark]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.15"

    - name: Install build dependency
      run: python -m pip install build

    - name: Build a binary wheel and a source tarball
      run: python -m build

    - name: Upload distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: pymovements-distribution-packages-${{ github.sha }}
        path: dist/
        if-no-files-found: error
        retention-days: 1
        overwrite: true

  # The nightly tests are the only run that sees a new upstream release. Their
  # failure lands in one standing issue instead of blocking pull requests.
  report:
    name: report a failed nightly run
    needs: [tests]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly build against the newest dependencies failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --body "$(cat <<EOF
          The scheduled tests install the newest releases of all dependencies instead of the
          versions pinned in \`constraints.txt\`, and they failed: $RUN_URL

          Pull requests keep installing the pinned versions, so they are not affected until the
          next constraints refresh picks the release up. Fix the incompatibility, then close this
          issue. The nightly run comments here while it keeps failing.
          EOF
          )"
          fi
