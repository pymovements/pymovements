name: benchmark

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  pytest-benchmark:
    name: pytest-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pymovements repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find baseline commit
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sha=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          else
            sha=$(git rev-parse --verify HEAD^)
          fi
          echo "baseline commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore cached environment
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          key:
            benchmark-ubuntu-latest-py314-${{ hashFiles('tox.ini', 'pyproject.toml', '.github/workflows/benchmark.yml') }}
          path: |
            ~/.cache
            ~/.tox

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tox
        run: python -m pip install tox

      - name: Checkout baseline commit
        env:
          SHA: ${{ steps.baseline.outputs.sha }}
        run: git checkout --quiet "$SHA"

      - name: Setup baseline benchmark environment
        run: tox -vv --notest -e benchmark

      - name: Benchmark baseline commit
        run: |
          tox --skip-pkg-install -e benchmark
          mv benchmark-data.json benchmark-data-baseline.json

      - name: Checkout head commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git checkout --quiet "$SHA"

      - name: Setup head benchmark environment
        run: tox -vv --notest --recreate -e benchmark

      - name: Cache environment
        uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          key:
            ${{ steps.cache-restore.outputs.cache-primary-key }}
          path: |
            ~/.cache
            ~/.tox

      - name: Benchmark head commit
        run: tox --skip-pkg-install -e benchmark

      # The action compares a result with the last entry in its data file, so
      # the baseline pass seeds the file and the head pass compares. The token
      # is for the commit lookup on schedule and dispatch, their payload has none.
      - name: Record baseline result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pytest-benchmark
          tool: 'pytest'
          output-file-path: benchmark-data-baseline.json
          external-data-json-path: ./comparison/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false

      # The action stamps every entry with the commit from the event payload,
      # the head. Name the baseline entry after the baseline commit so the
      # comparison header reads "Previous: <baseline>".
      - name: Stamp the baseline entry with the baseline commit
        env:
          SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          jq --arg sha "$SHA" \
            '.entries["pytest-benchmark"][-1].commit |= (.id = $sha | .url = (.url | sub("[0-9a-f]{40}$"; $sha)))' \
            comparison/benchmark-data.json > stamped.json
          mv stamped.json comparison/benchmark-data.json

      - name: Compare head against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pytest-benchmark
          tool: 'pytest'
          output-file-path: benchmark-data.json
          external-data-json-path: ./comparison/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          summary-always: true
          alert-comment-cc-users: '@dkrako,@cbueth,@SiQube'
