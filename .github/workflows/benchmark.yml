name: benchmark

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  pytest-benchmark:
    name: pytest-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pymovements repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find merge-base
        id: merge-base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "sha=$(git merge-base "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      - name: Restore cached environment
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          key:
            benchmark-ubuntu-latest-py314-${{ hashFiles('tox.ini', 'pyproject.toml', '.github/workflows/benchmark.yml') }}
          path: |
            ~/.cache
            ~/.tox

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tox
        run: python -m pip install tox

      - name: Setup benchmark environment
        if: github.event_name != 'pull_request'
        run: tox -vv --notest -e benchmark

      - name: Cache environment
        uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          key:
            ${{ steps.cache-restore.outputs.cache-primary-key }}
          path: |
            ~/.cache
            ~/.tox

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        run: tox --skip-pkg-install -e benchmark

      - name: Checkout merge-base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.merge-base.outputs.sha }}
          fetch-depth: 0

      - name: Setup merge-base benchmark environment
        if: github.event_name == 'pull_request'
        run: tox -vv --notest -e benchmark

      - name: Benchmark merge-base
        if: github.event_name == 'pull_request'
        run: tox --skip-pkg-install -e benchmark -- --benchmark-save=merge-base

      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Keep the merge-base result in .benchmarks for the comparison step.
          clean: false

      - name: Recreate pull request benchmark environment
        if: github.event_name == 'pull_request'
        run: tox -vv --notest --recreate -e benchmark

      - name: Benchmark pull request head and compare
        if: github.event_name == 'pull_request'
        # 50% slower means 1.5x the runtime, matching the old alert threshold.
        run: >-
          tox --skip-pkg-install -e benchmark --
          --benchmark-compare=0001
          --benchmark-compare-fail=mean:50%

      - name: Download previous benchmark data
        uses: actions/cache@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ./cache
          key: benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: benchmark-main

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: pytest-benchmark
          tool: 'pytest'
          output-file-path: benchmark-data.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
          summary-always: true
          alert-comment-cc-users: '@dkrako,@cbueth,@SiQube'
