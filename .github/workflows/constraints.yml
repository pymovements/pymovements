name: constraints

# Pull requests install the dependency versions pinned in constraints.txt. This
# workflow recompiles the file once a week and opens one pull request when the
# resolution changed, so a breaking upstream release fails that pull request
# and no other.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    name: refresh the constraints file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      # Releases younger than a day are skipped: their wheels are often still uploading.
      - name: Recompile the constraints file
        run: |
          {
            echo "# Dependency versions installed by the continuous integration, see tox.ini."
            echo "# Generated by .github/workflows/constraints.yml, never edited by hand."
            uv pip compile --universal --python-version 3.11 \
              --extra dev --extra docs --extra datasets --no-annotate --no-header \
              --exclude-newer "$(date -u -d '1 day ago' +%Y-%m-%d)" pyproject.toml
          } > constraints.txt

      - name: Open a pull request when the resolution changed
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: build/constraints-refresh
          delete-branch: true
          commit-message: "build: refresh the CI constraints"
          title: "build: refresh the CI constraints"
          body: |
            Weekly refresh of `constraints.txt`, the dependency versions the continuous
            integration installs.

            When the checks fail, a dependency release broke pymovements. Fix the
            incompatibility on this branch, the pins stay as compiled.

      # A pull request opened with the workflow token starts no workflow run on its own,
      # a dispatch does.
      - name: Start the checks on the pull request
        if: ${{ contains(fromJSON('["created", "updated"]'), steps.pull-request.outputs.pull-request-operation) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref build/constraints-refresh
          gh workflow run benchmark.yml --repo "$GITHUB_REPOSITORY" --ref build/constraints-refresh
