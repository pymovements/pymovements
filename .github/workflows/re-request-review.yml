name: Re-request review

# When an author marks a draft pull request ready for review, GitHub requests only the code
# owners who have not reviewed yet. A reviewer who requested changes gets no new request, so
# this workflow re-requests them.
on:
  # pull_request_target is required to get a write token for pull requests from forks.
  # It is safe here because the job never checks out or runs code from the pull request,
  # it only calls the GitHub API.
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  re-request-review:
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to request reviewers
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Reviews are listed oldest first. COMMENTED reviews do not change a reviewer's
            // state, which matches GitHub's own review decision.
            const latestState = new Map();
            for (const review of reviews) {
              if (!review.user || review.user.type === 'Bot') continue;
              if (review.user.login === pr.user.login) continue;
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                latestState.set(review.user.login, review.state);
              }
            }

            const reviewers = [...latestState]
              .filter(([, state]) => state === 'CHANGES_REQUESTED')
              .map(([login]) => login);

            if (reviewers.length === 0) {
              core.info('No reviewer with requested changes, nothing to re-request.');
              return;
            }

            core.info(`Re-requesting review from: ${reviewers.join(', ')}`);
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers,
            });
