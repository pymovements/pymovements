name: "EMTeC"

long_name: 'Eye movements on Machine-generated Texts Corpus'

description: |
  EMTeC dataset :cite:p:`EMTeC`.

  This dataset includes eye-tracking data from 107 native speakers of English reading
  machine-generated texts.  Eye movements are recorded at a sampling frequency of 1,000 Hz
  using an EyeLink 1000 eye tracker and are provided as pixel coordinates.

  Check the respective paper for details :cite:p:`EMTeC`.

resources:
  - content: gaze
    source:
      url: "https://osf.io/download/374sk/"
      filename: "subject_level_data.zip"
      md5: "dca99e47ef43f3696acec4fd70967750"
    filename_pattern: 'ET_{subject_id:d}.csv'
    filename_pattern_schema_overrides:
      subject_id: !int
    load_kwargs:
      trial_columns: ['item_id']
      time_column: 'time'
      time_unit: 'ms'
      pixel_columns: ['x', 'y']
      read_csv_kwargs:
        separator: "\t"
        columns:
          - "item_id"
          - "TRIAL_ID"
          - "Trial_Index_"
          - "model"
          - "decoding_strategy"
          - "time"
          - "x"
          - "y"
          - "pupil_right"
        schema_overrides:
          item_id: !polars.Utf8
          TRIAL_ID: !polars.Int64
          Trial_Index_: !polars.Int64
          model: !polars.Utf8
          decoding_strategy: !polars.Utf8
          time: !polars.Int64
          x: !polars.Float32
          y: !polars.Float32
          pupil_right: !polars.Float32

  # EMTeC publishes two fixation sets of the same trials, both loaded as precomputed_events.
  # The `variant` key captures the file stem: `fixations` is the uncorrected set,
  # `fixations_corrected` the manually corrected one. Note the reverse of PoTeC, where the plain
  # `fixations` folder holds the corrected set. Capturing the stem is a stopgap: a resource cannot
  # yet declare what it is, see issue 1434 (resource names).
  - content: precomputed_events
    source:
      url: "https://osf.io/download/2hs8p/"
      filename: "fixations.csv"
      md5: "5e05a364a1d8a044d8b36506aa91437e"
    filename_pattern: "(?P<variant>fixations).csv"
    load_kwargs:
      read_csv_kwargs:
        separator: "\t"

  - content: precomputed_events
    source:
      url: "https://osf.io/download/w3gan/"
      filename: "fixations_corrected.csv"
      md5: "0eb2fd2bb32169eb7f828dadd6d70d3b"
    filename_pattern: "(?P<variant>fixations_corrected).csv"
    load_kwargs:
      read_csv_kwargs:
        separator: "\t"

  - content: precomputed_reading_measures
    source:
      url: "https://osf.io/download/s4ny8/"
      filename: "reading_measures.csv"
      md5: "56880f50af20682558065ac2d26be827"
    filename_pattern: "reading_measures.csv"
    load_kwargs:
      read_csv_kwargs:
        separator: "\t"

experiment:
  screen_width_px: 1280
  screen_height_px: 1024
  screen_width_cm: 38.2
  screen_height_cm: 30.2
  distance_cm: 60
  origin: "center"
  sampling_rate: 2000
