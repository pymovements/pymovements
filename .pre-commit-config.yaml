ci:
  autoupdate_commit_msg: 'ci: pre-commit autoupdate'
  skip: [ pylint ]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [ --fix, --show-fixes ]
      - id: ruff-check
        name: ruff-add-future-annotations
        files: ^src/
        exclude: __init__\.py$
        args:
          - --select
          - I002
          - --fix
          - --config
          - 'lint.isort.required-imports = ["from __future__ import annotations"]'
  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
        alias: cffconvert
        name: Validating CITATION.cff using 'cffconvert'`
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.25.0
    hooks:
      - id: toml-sort-fix
  - repo: https://github.com/dannysepler/rm_unneeded_f_str
    rev: v0.2.0
    hooks:
      - id: rm-unneeded-f-str
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--keep-id, --keep-metadata-keys=cell.metadata.tags, --extra-keys=metadata.kernelspec metadata.language_info]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        args: [ --use-current-year ]
        types: [ python ]
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.11.1
    hooks:
      - id: pydoclint
        args: [ "--config=pyproject.toml" ]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [ pandas-stubs, types-tqdm, types-PyYAML ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [ "--unsafe" ]
      - id: debug-statements
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: name-tests-test
        # exempt fixture modules anywhere and helper modules in tests/plugins/
        exclude: .*_fixtures\.py|tests/plugins/
      - id: no-commit-to-branch
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0
    hooks:
      - id: doc8
  - repo: https://github.com/PyCQA/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [ python ]
        files: ^src/
        args: [ '--output-format=parseable' ]
      - id: pylint
        name: pylint-tests-directory
        entry: pylint
        language: system
        types: [ python ]
        files: ^tests/
        args: [ '--output-format=parseable' ]
  - repo: local
    hooks:
      - id: write-datasets-yaml
        name: write-datasets-yaml
        entry: python src/pymovements/_scripts/write_datasets_yaml.py
        language: python
        verbose: true
        additional_dependencies:
          - pyyaml
