[build-system]
requires = [
  "setuptools>=61.0.0",
  "wheel",
  "setuptools-git-versioning>=3.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pymovements"
description = "A python package for processing eye movement data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
maintainers = [
  { name = "Daniel Krakowczyk", email = "daniel.krakowczyk@uni-potsdam.de" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed"
]
dependencies = [
  "deprecated>=1.2.18",
  "fastexcel>=0.13.0",
  "matplotlib>=3.8.0",
  "numpy>=1.22.4",
  "pandas>=2.1.4",
  "polars>=2.0.0",
  "pyarrow>=14.0.0",
  "pyopenssl>=22.0.0",
  "pyparsing>=3.1.2",
  "pyreadr>=0.5.2",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.2",
  "scipy>=1.8.0",
  "tqdm>=4.63.0",
  "typing_extensions>=4.0.0"
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
  "ipykernel>=6.13.0",
  "ipywidgets>=8.1.7",
  "myst-nb>=1.0.0",
  "nbconvert>=7.0.0",
  "pandoc>=2.0.1",
  "pybtex>=0.25.0",
  "pydata-sphinx-theme>=0.12",
  "setuptools>=61.0.0",
  "sphinx>=7.0",
  "sphinx-copybutton>=0.5.0",
  "sphinx-favicon>=1.0.1",
  "sphinx_design>=0.3.0",
  "sphinx_mdinclude>=0.5.0",
  "sphinxcontrib.datatemplates>=0.9.2",
  "sphinxcontrib.bibtex>=2.4.2"
]
dev = [
  "codespell>=2.2",
  "covdefaults>=2.3.0",
  "tox>=4.12.0",
  "pybtex>=0.25.0",
  "pytest>=8.4.0",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=4.0.0",
  "pytest-doctestplus>=1.7.0",
  "pytest-remotedata>=0.4.1",
  "pytest-rerunfailures>=16.0",
  "setuptools>=61.0.0",
  "types-tqdm>=4.67.0",
  "pre-commit>=3.0.0",
  "pylint>=4.0.0",
  "ruff>=0.15.2"
]

[project.urls]
Homepage = "https://github.com/pymovements/pymovements"
"Source Code" = "https://github.com/pymovements/pymovements"
Documentation = "https://pymovements.readthedocs.io/en/stable"
"Bug Tracker" = "https://github.com/pymovements/pymovements/issues"
Changelog = "https://github.com/pymovements/pymovements/releases"

[tool.codespell]
skip = "./src/pymovements/_version.py,./.git/*,./.pytest_cache/*,tests/files/*,*.bib"
count = true
quiet-level = 3
ignore-words-list = 'bund,InstRead'

[tool.coverage.paths]
source = [
  'src/pymovements',
  '*/site-packages/pymovements',
  '*/src/pymovements'
]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.coverage.run]
plugins = ['covdefaults']
parallel = true
branch = true
omit = [
  'docs/*',
  'src/pymovements/_version.py',
  'tests/*'
]

[tool.doc8]
max-line-length = 100

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deprecated.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "docs.*"
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pydoclint]
skip-checking-raises = true
treat-property-methods-as-class-attributes = true

[tool.pylint.format]
max-module-lines = 2000

[tool.pylint.main]
ignore-paths = ["src/pymovements/_version.py"]
py-version = "3.10"

# Only the checks ruff lacks; the rest of the linting runs in ruff.
[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "abstract-method",
  "arguments-differ",
  "arguments-renamed",
  "attribute-defined-outside-init",
  "cyclic-import",
  "duplicate-code",
  "no-member",
  "no-value-for-parameter",
  "not-callable",
  "redefined-outer-name",
  "signature-differs",
  "too-many-function-args",
  "too-many-lines",
  "unexpected-keyword-arg",
  "unused-private-member",
  "useless-suppression"
]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 16

[tool.pytest.ini_options]
addopts = "-ra -l --tb=long --doctest-modules --doctest-plus --remote-data=any --import-mode=importlib -p doctest_fixtures"
doctest_optionflags = "NORMALIZE_WHITESPACE"
filterwarnings = [
  "error",
  "ignore:pkg_resources is deprecated.*:UserWarning:pybtex",
  "ignore:pkg_resources is deprecated.*:DeprecationWarning:pybtex",
  "ignore:Deprecated call to `pkg_resources.declare_namespace.*:DeprecationWarning",
  "ignore:distutils Version classes are deprecated. Use packaging.version instead.:DeprecationWarning",
  "ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning",
  "ignore:datetime.datetime.utcfromtimestamp() is deprecated.*:DeprecationWarning"
]
markers = ["network: mark a test as requiring network access"]
pythonpath = ['docs/source', 'tests/doctest']
testpaths = ['tests', 'src']
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
force-exclude = true # honour excludes for files pre-commit passes explicitly
extend-exclude = ["src/pymovements/_version.py"]
builtins = ["display"] # notebooks, linted natively (drop nbqa)

[tool.ruff.lint]
preview = true
explicit-preview-rules = true # preview only for the codes listed by full code
select = [
  "E", # flake8, incl. E501
  "W",
  "F",
  "E111",
  "E112",
  "E113",
  "E114",
  "E115",
  "E116",
  "E117",
  "E201",
  "E202",
  "E203",
  "E211",
  "E221",
  "E222",
  "E225",
  "E226",
  "E227",
  "E228",
  "E231",
  "E251",
  "E252",
  "E261",
  "E262",
  "E265",
  "E266",
  "E271",
  "E272",
  "E275",
  "E301",
  "E302",
  "E303",
  "E304",
  "E305",
  "E306",
  "W391", # autopep8 territory
  "COM812", # add-trailing-comma
  "I",
  "UP",
  "D",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PLR1702",
  "PLR0916",
  "ARG",
  "SLF",
  "A",
  "BLE001",
  "B006",
  "B023",
  "B904",
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  "RUF100"
]
ignore = [
  "D107",
  "D203",
  "D213",
  "D413",
  "D416",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "PLC0415"
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
known-first-party = ["pymovements"]
force-sort-within-sections = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D101", "D102", "D103", "SLF001", "ARG", "PLR2004"]
"tests/**/*_fixtures.py" = ["D", "ARG"]
"docs/**" = ["A001", "ARG001", "BLE001", "D", "E402"]
"docs/source/tutorials/parsing-dataset.ipynb" = ["E501"]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 30
max-returns = 11
max-statements = 100
max-bool-expr = 5
max-nested-blocks = 5

[tool.setuptools.package-data]
pymovements = ["datasets/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}+post{ccount}.{sha}"
dirty_template = "{tag}+post{ccount}.{sha}.dirty"
