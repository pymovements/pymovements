name: MECOL1W1
long_name: Multilingual Eye-tracking Corpus native reader first wave
description: "MECOL1W1 dataset :cite:p:`MECOL1W1`.\n\nThis dataset includes eye tracking\
  \ data from several participants in a single\nsession. The participants read several\
  \ paragraphs of texts.\nThe participant is instructed to read texts and answer questions.\n\
  Check the respective paper for details :cite:p:`MECOL1W1`.\n\n.. note:: The reading\
  \ measures are distributed as R data files. Loading them needs the\n   ``rdata``\
  \ extra, install it with ``pip install 'pymovements[rdata]'``.\n"
resources:
- content: precomputed_events
  source:
    url: https://osf.io/download/uza8d/
    filename: joint_l1_fixation_version2.0.rda
    md5: 3c969a930a71cd62c67b936426dd079b
  filename_pattern: joint_l1_fixation_version2.0.rda
  load_kwargs:
    trial_columns:
    - uniform_id
    - itemid
    r_dataframe_key: joint.fix
- content: precomputed_reading_measures
  source:
    url: https://osf.io/download/n5pvh/
    filename: sentence_data_version2.0.csv
    md5: 609f82b6f45b7c98a0769c6ce14ee6e9
  filename_pattern: sentence_data_version2.0.csv
