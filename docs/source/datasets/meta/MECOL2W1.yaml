name: MECOL2W1
long_name: Multilingual Eye-tracking Corpus second language reader first wave
description: "MECOL2W1 dataset :cite:p:`MECOL2W1`.\n\nThis dataset includes eye tracking\
  \ data from several participants in a single\nsession. The participants read several\
  \ paragraphs of texts.\nThe participant is instructed to read texts and answer questions.\n\
  Check the respective paper for details :cite:p:`MECOL2W1`.\n\n.. note:: The reading\
  \ measures are distributed as R data files. Loading them needs the\n   ``rdata``\
  \ extra, install it with ``pip install 'pymovements[rdata]'``.\n"
resources:
- content: precomputed_events
  source:
    url: https://osf.io/download/8rygu/
    filename: joint_l2_fixation_trimmed_report_2.0.rda
    md5: 1ff32c5823eb70c22bab725499fbbf87
  filename_pattern: joint_l2_fixation_trimmed_report_2.0.rda
  load_kwargs:
    trial_columns:
    - uniform_id
    - itemid
    r_dataframe_key: joint.fix.l2
- content: precomputed_reading_measures
  source:
    url: https://osf.io/download/re7uy/
    filename: joint_data_l2_trimmed_version2.0.rda
    md5: 3d10225781faf413467104dcc4e071e0
  filename_pattern: joint_data_l2_trimmed_version2.0.rda
  load_kwargs:
    r_dataframe_key: joint.data
