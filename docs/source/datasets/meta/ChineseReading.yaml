name: ChineseReading
description: "ChineseReading dataset :cite:p:`ChineseReading`.\n\nThis dataset includes\
  \ eye tracking data from more than 300 participants recorded in a single\nsession.\
  \ Precomputed events and word-level reading measures are reported.\nEach participant\
  \ is instructed to read several sentences.\nCheck the respective paper for details\
  \ :cite:p:`ChineseReading`.\n\n.. note:: The reading measures are distributed as\
  \ Excel files. Loading them needs the\n   ``excel`` extra, install it with ``pip\
  \ install 'pymovements[excel]'``.\n"
resources:
- content: precomputed_events
  source:
    url: https://files.osf.io/v1/resources/94wue/providers/osfstorage/6253cb37840dd726e75c831a
    filename: Raw Data.txt
  filename_pattern: Raw Data.txt
  load_kwargs:
    trial_columns:
    - Subject
    - Sentence_ID
    read_csv_kwargs:
      separator: "\t"
- content: precomputed_reading_measures
  source:
    url: https://files.osf.io/v1/resources/94wue/providers/osfstorage/?zip=
    filename: chinese_reading_measures.zip
  filename_pattern: '{measure_type:s} Measures.xlsx'
  load_kwargs:
    read_excel_kwargs:
      sheet_name: Sheet 1
